[package]
name = "handy-diagnostics-lifecycle"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
loom = "=0.7.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
log = "0.4"
tempfile = "3"

[build-dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }

[workspace]
